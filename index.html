<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Treino de Massa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: coluna única de celular, preto e rosa, sempre escuro. Abas em pílula embaixo. Números em mono, títulos em condensada de placa de academia. */
:root {
  --bg: #09090B;
  --surface: #141015;
  --surface-2: #1F1920;
  --ink: #F7EEF3;
  --ink-2: #B1A1AB;
  --line: #302632;
  --accent: #FF4FA3;
  --accent-ink: #1B0612;
  --accent-soft: #3B1329;
  --glow: rgba(255, 79, 163, .45);
  --c2: #C9A2FF;
  --good: #63DBA2;
  --warn: #FFB454;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
/* identidade escolhida: preto e rosa, sempre escuro */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background-color: var(--bg); background-image: radial-gradient(90% 38% at 50% -6%, #3a1028 0%, rgba(58,16,40,0) 70%); background-repeat: no-repeat; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 96px; }
main { max-width: 560px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: .015em; }
h1::after { content: ''; display: block; width: 44px; height: 4px; border-radius: 4px; background: var(--accent); margin-top: 10px; box-shadow: 0 0 14px var(--glow); }
h2 { font-size: 1.6rem; text-transform: uppercase; }
h3 { font-size: 1.25rem; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.muted { color: var(--ink-2); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }
.spread { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.top { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 4px 14px; }
.top .ava { margin-left: auto; width: 38px; height: 38px; border-radius: 50%; padding: 0; border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 14px -4px var(--glow); }
.top .ava img, .avabig img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avabig { width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 22px -6px var(--glow); flex: 0 0 auto; }
.top svg { width: 26px; height: 26px; color: var(--accent); filter: drop-shadow(0 0 8px var(--glow)); }
.top span { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .14em; text-transform: uppercase; }
.top span b { color: var(--accent); font-weight: 700; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; min-height: 48px; box-shadow: 0 8px 22px -8px var(--glow); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; font-weight: 600; }
.btn.ghost:hover { border-color: var(--accent); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
.btn.block { width: 100%; }
.pill { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.pill.good { background: transparent; border: 1px solid var(--good); color: var(--good); }

/* abas */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(12, 9, 13, .94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); gap: 2px; padding-inline: 6px; padding-top: 6px; display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
nav.tabs button { background: none; border: 0; border-radius: 999px; margin-block: 2px 6px; padding: 10px 2px; font-family: var(--font-display); font-weight: 600; font-size: .8rem; letter-spacing: 0; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px -6px var(--glow); }

/* formulário de perfil */
.field { display: flex; flex-direction: column; gap: 6px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 10px 6px; font-weight: 500; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.seg.wrap { grid-auto-flow: row; grid-template-columns: repeat(2, 1fr); }
input[type=number], select, input[type=text] { font: inherit; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 46px; width: 100%; }

/* dia de treino */
.daychip { flex: 0 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; text-align: left; }
.daychip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.trl { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.tr { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; color: var(--ink); }
.tr.prox { border-color: var(--accent); background: linear-gradient(135deg, #2a0f1e 0%, var(--surface) 70%); box-shadow: 0 10px 28px -14px var(--glow); }
.tr .let { font-family: var(--font-display); font-weight: 700; font-size: 2rem; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: var(--accent-soft); color: var(--accent); flex: 0 0 auto; }
.tr .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tr .info b { overflow-wrap: anywhere; }
.tr .play { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 1rem; padding-left: 3px; box-shadow: 0 8px 20px -6px var(--glow); }
.tr .pill { position: absolute; top: -11px; right: 16px; background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.vid { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-weight: 600; font-size: .9rem; text-decoration: none; }
.vid span[aria-hidden] { font-size: .7rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.actbar { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); padding: 28px 16px 10px; background: linear-gradient(to top, var(--bg) 55%, rgba(9, 9, 11, 0)); z-index: 9; pointer-events: none; }
.actbar .btn { max-width: 528px; margin: 0 auto; display: block; width: 100%; pointer-events: auto; font-size: 1.05rem; min-height: 54px; }
.actbar .btn.fin { background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--accent); box-shadow: none; }
.exl { display: flex; flex-direction: column; gap: 10px; }
.exrow { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; color: var(--ink); }
.exrow .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
.exrow .nm small { font-weight: 500; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.exrow .pg { font-family: var(--font-mono); font-size: .85rem; color: var(--ink-2); }
.exrow .chev { color: var(--ink-2); transition: transform .2s; }
.exrow[aria-expanded="true"] { border-color: var(--accent); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.exrow[aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--accent); }
.exrow.fin .pg { color: var(--accent); font-weight: 600; }
.expan { background: var(--surface); border: 1px solid var(--accent); border-top: 0; border-radius: 0 0 18px 18px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; margin-top: -10px; }
.sers { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sbtn { min-height: 48px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 700; padding: 0 20px; }
.sbtn.cur { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 20px -8px var(--glow); }
.sbtn.cur.dn { background: var(--accent-soft); color: var(--accent); }
.sbtn.circ { width: 48px; padding: 0; }
.sbtn.dn:not(.cur) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.tile .label { letter-spacing: .04em; }
.tile input { text-align: center; font-family: var(--font-mono); font-size: 1.15rem; font-weight: 500; min-height: 40px; padding: 4px; background: var(--bg); border-radius: 10px; }
.tile .v { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 500; min-height: 40px; display: grid; place-items: center; }
.tile .sub { font-size: .72rem; color: var(--ink-2); }
.ex { padding: 0; overflow: hidden; }
.ex-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 6px; }
.ex-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.target { font-family: var(--font-mono); font-size: .85rem; background: var(--surface-2); padding: 3px 8px; border-radius: 6px; }
.setrow { display: grid; grid-template-columns: 28px 1fr 1fr 48px; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
.setrow input { text-align: center; font-family: var(--font-mono); padding: 8px 4px; min-height: 44px; }
.setrow .n { font-family: var(--font-mono); color: var(--ink-2); }
.chk { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.2rem; line-height: 1; }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px -6px var(--glow); }
.setcols { display: grid; grid-template-columns: 28px 1fr 1fr 48px; gap: 8px; padding: 0 14px 4px; }
.hint { padding: 8px 14px 12px; font-size: .85rem; color: var(--ink-2); border-top: 1px solid var(--line); }
.hint b { color: var(--ink); font-weight: 600; }

/* temporizador */
.timer { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 8px); max-width: 528px; margin-inline: auto; background: var(--accent); color: var(--accent-ink); border-radius: 18px; box-shadow: 0 12px 30px -10px var(--glow); padding: 10px 14px; display: flex; align-items: center; gap: 12px; z-index: 9; }
.timer .t { font-family: var(--font-mono); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.timer button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 6px 12px; min-height: 36px; }

/* volume semanal */
.vol { display: grid; grid-template-columns: 88px 1fr 34px 30px; gap: 8px; align-items: center; font-size: .9rem; }
.track { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.band { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); }
.fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); border-radius: 6px; }
.prio { color: var(--accent); font-weight: 600; }
.vol .fq { font-family: var(--font-mono); font-size: .8rem; color: var(--ink-2); text-align: right; }
.grp { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 48px; font-weight: 600; text-align: left; }
.grp[aria-expanded="true"] { border-color: var(--accent); }
.grp .cnt { font-family: var(--font-mono); font-size: .85rem; color: var(--accent); font-weight: 500; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchips button { background: var(--surface-2); border: 1px solid transparent; border-radius: 999px; padding: 6px 14px; min-height: 40px; font-weight: 500; }
.mchips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.tg { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 36px; font-weight: 600; }
.tg[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dayrow { display: flex; flex-direction: column; gap: 10px; padding-block: 12px; border-top: 1px solid var(--line); }
.dayrow:first-of-type { border-top: 0; }
.weeks { display: flex; gap: 3px; }
.wk { flex: 1; height: 12px; border-radius: 3px; background: var(--accent-soft); }
.wk.done { background: var(--accent); }
.wk.deload { background: transparent; border: 1.5px solid var(--warn); }
.wk.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.split { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); }
.split span { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-family: var(--font-display); font-size: 2rem; line-height: 1; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .wd { text-align: center; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; padding-bottom: 2px; }
.cal .cd { aspect-ratio: 1; min-height: 44px; min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: var(--font-mono); font-size: .85rem; padding: 0; }
.cal .cd .mk { font-family: var(--font-body); font-size: .8rem; line-height: 1; min-height: .8rem; }
.cal .cd[data-s="foi"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cal .cd[data-s="nao"] { border-color: var(--warn); color: var(--warn); }
.cal .cd[data-s="plan"] { border-style: dashed; border-color: var(--accent); }
.cal .cd.hoje { outline: 2px solid var(--ink); outline-offset: -3px; }
.cal .cd.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.banner { background: linear-gradient(135deg, var(--accent-soft), var(--surface)); border: 1px solid var(--accent); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.vol .num { font-family: var(--font-mono); text-align: right; }

.hist { display: flex; flex-direction: column; gap: 8px; }
.hist .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.empty { text-align: center; padding: 28px 8px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(210px + env(safe-area-inset-bottom, 0px)); background: var(--surface-2); color: var(--ink); border: 1px solid var(--accent); box-shadow: 0 10px 28px -10px var(--glow); padding: 10px 16px; border-radius: 999px; font-size: .9rem; z-index: 20; max-width: 90vw; }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .4s ease; } }
</style>
</head>
<body>
<header class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Treino <b>de Massa</b></span><button type="button" class="ava" id="ava" data-act="tab" data-t="perfil" aria-label="Abrir meu perfil"></button></header>
<main id="app" aria-live="polite"></main>
<div id="timer" class="timer" hidden role="timer" aria-label="Descanso">
  <span class="label" style="color:inherit;opacity:.8">Descanso</span>
  <span class="t" id="timerT">0:00</span>
  <span style="flex:1"></span>
  <button type="button" id="timerAdd">+30 s</button>
  <button type="button" id="timerX">Fechar</button>
</div>
<div id="toast" class="toast" hidden role="status"></div>
<nav class="tabs" aria-label="Seções">
  <button type="button" data-t="historico" aria-selected="true">Calendário</button>
  <button type="button" data-t="hoje" aria-selected="false">Hoje</button>
  <button type="button" data-t="treinos" aria-selected="false">Treinos</button>
  <button type="button" data-t="analise" aria-selected="false">Análise</button>
  <button type="button" data-t="perfil" aria-selected="false">Perfil</button>
</nav>
<script>
/* ===== Biblioteca de exercícios e gerador de plano ===== */
const MUSC = {
  peito: 'Peito', costas: 'Costas', ombros: 'Ombros', biceps: 'Bíceps', triceps: 'Tríceps',
  quadriceps: 'Quadríceps', posterior: 'Posterior', gluteos: 'Glúteos', panturrilha: 'Panturrilha', abdomen: 'Abdômen'
};
const BIG = ['peito', 'costas', 'quadriceps', 'posterior', 'gluteos'];
/* E(id, nome, músculo, tipo c=composto i=isolador, ambientes A=academia H=halteres C=corpo, sem carga externa) */
function E(id, n, m, t, env, bw) { return { id, n, m, t, env, bw: !!bw }; }
const LIB = [
  E('supino-reto-barra', 'Supino reto com barra', 'peito', 'c', 'A'),
  E('supino-inclinado-halt', 'Supino inclinado com halteres', 'peito', 'c', 'AH'),
  E('supino-reto-halt', 'Supino reto com halteres', 'peito', 'c', 'AH'),
  E('flexao', 'Flexão de braço', 'peito', 'c', 'ACH', 1),
  E('flexao-pes-elevados', 'Flexão com pés elevados', 'peito', 'c', 'CH', 1),
  E('crucifixo-cabo', 'Crucifixo no cabo (crossover)', 'peito', 'i', 'A'),
  E('crucifixo-halt', 'Crucifixo inclinado com halteres', 'peito', 'i', 'AH'),
  E('voador', 'Voador (peck deck)', 'peito', 'i', 'A'),

  E('puxada-frente', 'Puxada na frente', 'costas', 'c', 'A'),
  E('remada-curvada', 'Remada curvada com barra', 'costas', 'c', 'A'),
  E('remada-sentada', 'Remada sentada no cabo', 'costas', 'c', 'A'),
  E('remada-unilateral', 'Remada unilateral com halter', 'costas', 'c', 'AH'),
  E('remada-curvada-halt', 'Remada curvada com halteres', 'costas', 'c', 'H'),
  E('remada-invertida', 'Remada invertida (mesa ou barra baixa)', 'costas', 'c', 'C', 1),
  E('remada-elastico', 'Remada com elástico', 'costas', 'c', 'C'),
  E('pullover-halt', 'Pull-over com halter', 'costas', 'i', 'H'),
  E('pulldown-reto', 'Pulldown com braço reto', 'costas', 'i', 'A'),

  E('desenvolvimento-halt', 'Desenvolvimento com halteres', 'ombros', 'c', 'AH'),
  E('desenvolvimento-maquina', 'Desenvolvimento na máquina', 'ombros', 'c', 'A'),
  E('pike', 'Flexão em pike', 'ombros', 'c', 'C', 1),

const TREINOS = [['a', 'Treino A', 'A'], ['b', 'Treino B', 'B'], ['c', 'Treino C', 'C'], ['d', 'Treino D', 'D'], ['e', 'Treino E', 'E'], ['f', 'Treino F', 'F']];

/* tempo do treino: 5 min de aquecimento, descanso calculado pelo app (mínimo 60 s), ~45 s para fazer cada série
   e uma folga por exercício para trocar de aparelho ou esperar alguém terminar (3 min na academia) */
const REST_S = 60, REST_BIG = 90, EXEC_S = 45, WARM_S = 300, OVER_ACAD = 180, OVER_CASA = 60;
function overS(p) { return p.equip === 'academia' ? OVER_ACAD : OVER_CASA; }
function exSec(x, p) { return x.sets * (EXEC_S + (x.rest || REST_S)) + overS(p); }
function daySec(d, p) { return WARM_S + d.ex.reduce(function (a, x) { return a + exSec(x, p); }, 0); }
/* quantos exercícios de ~3 séries cabem no tempo escolhido */
function maxEx(p) { return Math.max(3, Math.floor(((p.duracao || 60) * 60 - WARM_S) / (3 * (EXEC_S + 75) + overS(p)))); }
/* garante que cada dia cabe no tempo: tira séries dos últimos exercícios (mínimo 2) e, se preciso, o último exercício */
function fitTime(plan, p) {
  const budget = (p.duracao || 60) * 60;
  plan.forEach(function (d) {
    let guard = 80;
    while (daySec(d, p) > budget && guard-- > 0) {
      let k = -1;
      for (let i = d.ex.length - 1; i >= 0; i--) if (d.ex[i].sets > 2) { k = i; break; }
      if (k >= 0) { d.ex[k].sets--; continue; }
      if (d.ex.length <= 1) break;
      const x = d.ex.pop(), m = BYID[x.id].m;
      if (!d.ex.some(function (y) { return BYID[y.id].m === m; }) && d.fora.indexOf(m) < 0) d.fora.push(m);

  ombros: [['c'], ['i', 'lateral'], ['i', 'inverso']], biceps: [['i'], ['i'], ['i']], triceps: [['i'], ['i'], ['i']],

const CICLO = { iniciante: 5, intermediario: 4, avancado: 3 };

function pickExercise(muscle, tipo, pref, env, used, rot) {
  const code = ENVCODE[env];
  const list = function (t) {
    return LIB.filter(function (e) { return e.m === muscle && e.t === t && e.env.indexOf(code) >= 0 && used.indexOf(e.id) < 0; });
  };
  let c = list(tipo);
  if (!c.length) c = list(tipo === 'c' ? 'i' : 'c');

  if (pref) {

    if (p.length) c = p;
  }
  return c[rot % c.length];
}

function prescribe(e, tipo, level, idx, prio, modo) {
  let sets = tipo === 'c' ? (level === 'avancado' ? 4 : 3) : (level === 'iniciante' ? 2 : 3);
  if (idx === 0 && level === 'intermediario') sets = Math.max(sets, 4);
  if (prio.indexOf(e.m) >= 0) sets = Math.min(5, sets + 1);
  const small = e.m === 'panturrilha' || e.m === 'abdomen';
  const b = modo === 'b';
  let lo, hi;
  if (small) { lo = b ? 15 : 12; hi = b ? 25 : 20; }
  else if (e.bw) { lo = tipo === 'c' ? (b ? 10 : 8) : (b ? 15 : 12); hi = tipo === 'c' ? (b ? 20 : 15) : (b ? 25 : 20); }
  else if (tipo === 'c') { const ini = level === 'iniciante'; lo = ini ? (b ? 10 : 8) : (b ? 8 : 6); hi = ini ? (b ? 15 : 12) : (b ? 12 : 10); }
  else { lo = b ? 12 : 10; hi = b ? 18 : 15; }
  /* descanso: 90 s nos exercícios compostos (carga alta), 60 s nos isolados, abdômen e panturrilha */
  const rest = (tipo === 'c' && !small) ? REST_BIG : REST_S;
  const inc = tipo === 'c' ? (['quadriceps', 'posterior', 'gluteos'].indexOf(e.m) >= 0 ? 5 : 2.5) : 2;
  return { sets: sets, lo: lo, hi: hi, rest: rest, inc: inc };
}

/* distribui os exercícios do dia entre os músculos que você escolheu: grandes e prioritários recebem mais */
function buildDay(musc, p, n, occ, modo, max) {
  const prio = p.prioridade;
  const w = function (m) { return (BIG.indexOf(m) >= 0 ? 2 : 1) + (prio.indexOf(m) >= 0 ? 1 : 0); };
  let ms = musc.slice().sort(function (a, b) { return w(b) - w(a); });
  const fora = ms.slice(max);
  ms = ms.slice(0, max);
  const al = {};
  ms.forEach(function (m) { al[m] = 1; });
  let free = max - ms.length;
  while (free > 0) {
    let best = null, bs = -1;
    ms.forEach(function (m) { if (al[m] < SEQ[m].length) { const sc = w(m) / al[m]; if (sc > bs) { bs = sc; best = m; } } });
    if (!best) break;
    al[best]++; free--;
  }
  const used = [], entries = [];
  ms.forEach(function (m) {
    const o = occ[m] || 0;
    occ[m] = o + 1;
    for (let k = 0; k < al[m]; k++) {
      const sq = SEQ[m][k];
      const e = pickExercise(m, sq[0], sq[1], p.equip, used, (n || 1) - 1 + o);
      if (!e) continue;
      used.push(e.id);
      entries.push(e);
    }
  });
  const rank = function (e) { const pr = prio.indexOf(e.m) >= 0; return e.t === 'c' ? (pr ? 0 : 1) : (pr ? 2 : 3); };
  const ordered = entries.map(function (e, i) { return [e, i]; })
    .sort(function (a, b) { return rank(a[0]) - rank(b[0]) || a[1] - b[1]; })
    .map(function (z) { return z[0]; });
  const list = ordered.map(function (e, idx) {
    const rx = prescribe(e, e.t, p.nivel, idx, prio, modo);
    return { id: e.id, slot: idx, sets: rx.sets, lo: rx.lo, hi: rx.hi, rest: rx.rest, inc: rx.inc };
  });
  return { list: list, fora: fora };
}

/* se um músculo prioritário ficou abaixo do topo da faixa semanal, acrescenta até 2 exercícios extras
   apenas nos dias em que você já o treina */
function boostPriority(plan, p, max, modo) {
  const prio = p.prioridade;
  const vol = weeklyVolume(plan);
  const notes = [];
  prio.forEach(function (m) {
    const days = plan.filter(function (d) { return d.ex.some(function (x) { return BYID[x.id].m === m; }); });
    if (!days.length) { notes.push({ m: m, ausente: true, extras: 0, vol: 0 }); return; }
    const target = volumeBand(p.nivel, m)[1];
    let extras = 0;
    while (vol[m] < target && extras < 2) {
      const order = days.slice().sort(function (a, b) { return a.ex.length - b.ex.length; });
      let added = false;
      for (let k = 0; k < order.length && !added; k++) {
        const d = order[k];
        const used = d.ex.map(function (x) { return x.id; });
        const e = pickExercise(m, 'i', null, p.equip, used, extras);
        if (!e) continue;
        const rx = prescribe(e, e.t, p.nivel, 99, prio, modo);
        if (daySec(d, p) + exSec(rx, p) > (p.duracao || 60) * 60) continue;
        d.ex.push({ id: e.id, slot: d.ex.length, sets: rx.sets, lo: rx.lo, hi: rx.hi, rest: rx.rest, inc: rx.inc });
        vol[m] += rx.sets; extras++; added = true;
      }
      if (!added) break;
    }
    notes.push({ m: m, extras: extras, vol: vol[m] });
  });
  return notes;
}

/* o app não passa do topo da faixa semanal: reduz séries (mínimo 2) dos últimos exercícios do músculo */
function trimExcess(plan, p) {
  const vol = weeklyVolume(plan);
  Object.keys(MUSC).forEach(function (m) {
    const hi = volumeBand(p.nivel, m)[1];
    let guard = 40;
    while (vol[m] > hi && guard-- > 0) {
      let alvo = null;
      plan.forEach(function (d) {
        d.ex.forEach(function (x) {
          if (BYID[x.id].m !== m || x.sets <= 2) return;
          if (!alvo || x.sets > alvo.sets || (x.sets === alvo.sets && BYID[x.id].t === 'i' && BYID[alvo.id].t === 'c')) alvo = x;
        });
      });
      if (!alvo) break;
      alvo.sets--; vol[m]--;
    }
  });
}

function generatePlan(p, semana, n) {
  const prio = Array.isArray(p.prioridade) ? p.prioridade : [];
  p = Object.assign({}, p, { prioridade: prio });
  const modo = (n || 1) % 2 === 1 ? 'a' : 'b';
  const max = maxEx(p);
  const occ = {};
  const plan = [];
  TREINOS.forEach(function (d, i) {
    const s = semana[d[0]];
    if (!s || !s.on || !s.musc.length) return;
    const r = buildDay(s.musc, p, n, occ, modo, max);
    plan.push({ key: d[0], dia: d[1], abrev: d[2], idx: i, musc: s.musc.slice(), nome: nomeDia(s.musc), ex: r.list, fora: r.fora.slice(), min: 0 });
  });
  plan.notes = boostPriority(plan, p, max, modo);
  trimExcess(plan, p);
  fitTime(plan, p);
  const vf = weeklyVolume(plan);
  plan.notes.forEach(function (nt) { nt.vol = vf[nt.m]; });
  plan.modo = modo;
  return plan;
}

function startLoad(e, p) {

  if (!L || !bw) return '';

function weeklyVolume(plan) {

  const nao = Object.keys(S.checkins).filter(function (k) { const a = daysAgo(k); return !S.checkins[k].foi && !map[k] && a >= 0 && a < 28; });

/* presença: dias em que você foi (treino registrado ou "Fui" no calendário), na semana, no mês e nas últimas 4 semanas */

    else if (lo > 0.7) out.push({ sev: 'info', t: 'Parte superior com pouco volume', x: 'Parte superior é só ' + Math.round((1 - lo) * 100) + '% das séries. Se não for intencional, acrescente séries de costas, peito ou ombros.' });
  }
  const pouca = base.filter(function (m) { return BIG.indexOf(m) >= 0 && (real ? F[m] < 1.5 : F[m] < 2); });
  if (pouca.length) out.push({ sev: 'info', t: 'Pouca frequência', x: nm(pouca) + (real ? ': treinado menos de 2 vezes por semana na média.' : ': aparece em apenas 1 dia.') + ' Treinar cada grupo grande 2 vezes por semana tende a render mais do que 1 vez com o mesmo volume.' });
  if (real) {
    const menos = base.filter(function (m) { return V[m] < 0.7 * P[m]; });
    if (menos.length) out.push({ sev: 'info', t: 'Fazendo menos do que o plano', x: menos.map(function (m) { return MUSC[m] + ' (' + f1(V[m]) + ' de ' + f1(P[m]) + ')'; }).join(', ') + ' séries por semana.' });
  }
  if (real && ds) {
    const alta = keys.filter(function (m) { return ['abdomen', 'panturrilha'].indexOf(m) < 0 && F[m] > 3; });
    if (alta.length) out.push({ sev: 'warn', t: 'Frequência alta demais', x: nm(alta) + ': mais de 3 vezes por semana na média. Cada músculo precisa de cerca de 48 horas para recuperar.' });
    if (ds.consec.length) out.push({ sev: 'info', t: 'Mesmo músculo em dias seguidos', x: nm(ds.consec) + ': treinado em dias seguidos nas últimas 4 semanas. Deixe ao menos 48 horas entre treinos do mesmo músculo.' });
    const parados = keys.filter(function (m) { return P[m] > 0 && ds.lastDays[m] !== undefined && ds.lastDays[m] >= 10; });
    if (parados.length) out.push({ sev: 'warn', t: 'Muito tempo sem treinar', x: parados.map(function (m) { return MUSC[m] + ' (há ' + ds.lastDays[m] + ' dias)'; }).join(', ') + '.' });
  }
  out.sort(function (a, b) { return (a.sev === 'warn' ? 0 : 1) - (b.sev === 'warn' ? 0 : 1); });
  if (!out.length) out.push({ sev: 'good', t: 'Sem desequilíbrios', x: real ? 'O que você tem feito está equilibrado entre os músculos.' : 'Sua semana está equilibrada entre os músculos.' });
  return out;
}

/* ===== utilidades ===== */
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function weekStart(d) {

  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x.getTime();
}
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }); } catch (e) { return iso; }
}
function fmtDay(dt) {
  try { return new Date(dt).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' }); } catch (e) { return ''; }
}
function fmtKg(n) { return Math.round(n).toLocaleString('pt-BR') + ' kg'; }
function fmtRest(s) { return s >= 120 ? (s / 60) + ' min' : s + ' s'; }
function fmtClock(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }

/* ===== temporizador de descanso ===== */
let tEnd = 0, tInt = null;
function beep() {
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    const c = new A(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 880; g.gain.value = 0.12;
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.35);
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
}
function tick() {
  const left = Math.ceil((tEnd - Date.now()) / 1000);
  const el = document.getElementById('timerT');
  if (left <= 0) { stopTimer(); beep(); toast('Descanso terminado. Próxima série.'); return; }
  el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
}
function startTimer(sec) {
  tEnd = Date.now() + sec * 1000;
  document.getElementById('timer').hidden = false;
  clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}
function stopTimer() { clearInterval(tInt); tInt = null; document.getElementById('timer').hidden = true; }
let toastT = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600);
}

/* ===== Telas: Hoje, Análise, Histórico, eventos e início ===== */

/* card de treino da lista: letra, nomes dos músculos, nº de exercícios e tempo, botão de play */
function cardTreino(d, tag) {

/* aba Treinos: lista dos seus treinos (A, B, C...) */
function listaTreinos(plan) {

  h += '<div class="trl">' + (av ? cardTreino(av, 'Hoje') : '') + plan.map(function (d) { return cardTreino(d, hojeKeys.indexOf(d.key) >= 0 ? 'Hoje' : (d.key === prox ? 'Próximo' : '')); }).join('') + '</div>' +
    '<div class="card stack"><div class="row spread"><span><b class="mono">' + bd.feitos + '/' + bd.meta + '</b> dias de academia</span><span class="muted" style="font-size:.85rem">Novo treino em <b>' + fmtDay(blocoEnd()) + '</b></span></div>' +

}

/* aba Hoje: confirmar presença e ir direto ao próximo treino */
function viewHoje() {

/* treino aberto: exercícios em lista; toque para abrir, conclua cada série e o descanso começa */
let OPENEX = -2, CURSET = {};
function firstOpen(draft) {
  for (let i = 0; i < draft.items.length; i++) if (draft.items[i].sets.some(function (s) { return !s.done; })) return i;
  return -1;
}
function curSet(i, it) {
  let j = CURSET[i];
  if (j === undefined || j >= it.sets.length) { j = it.sets.findIndex(function (s) { return !s.done; }); if (j < 0) j = it.sets.length - 1; CURSET[i] = j; }
  return j;
}
function viewTreinos() {
  if (!S.configured) return setupCard();
  const plan = getPlan();
  if (!plan.length) return '<div class="stack"><h1>Treinos</h1><div class="card empty">Você ainda não montou nenhum treino.</div><button class="btn block" data-act="tab" data-t="semana">Montar treinos</button></div>';
  if (SEL && !achaDia(SEL)) SEL = null;
  if (!SEL) return listaTreinos(plan);
  const day = achaDia(SEL);
  const draft = ensureDraft(day);
  if (OPENEX === -2) { OPENEX = firstOpen(draft); CURSET = {}; }
  const we = Math.min(weeksElapsed() + 1, S.bloco.semanas);
  const done = draft.items.reduce(function (a, it) { return a + it.sets.filter(function (s) { return s.done; }).length; }, 0);
  const total = draft.items.reduce(function (a, it) { return a + it.sets.length; }, 0);
  let h = '<div class="stack"><button class="btn ghost small" data-act="back" style="align-self:flex-start">&lsaquo; Todos os treinos</button>' +
    '<div><p class="label">' + day.dia + ' · bloco ' + S.bloco.n + ', semana ' + we + ' de ' + S.bloco.semanas + '</p><h1>' + esc(day.nome) + '</h1>' +
    '<p class="muted" style="margin-top:10px">≈ ' + day.min + ' min com aquecimento, descanso e tempo de trocar de aparelho.' + (draft.start ? ' <b class="mono" style="color:var(--accent)" id="elapsed">' + fmtClock(Math.floor((Date.now() - draft.start) / 1000)) + '</b>' : '') + '</p></div>';
  if (isDeload()) h += '<div class="card"><b>Semana leve.</b> Menos séries e cerca de 90% da carga.</div>';
  h += '<div class="exl">';
  day.ex.forEach(function (x, i) {
    const e = BYID[x.id], it = draft.items[i], n = it.sets.length, dn = it.sets.filter(function (s) { return s.done; }).length;
    const open = OPENEX === i, fin = dn === n;
    h += '<div><button type="button" class="exrow' + (fin ? ' fin' : '') + '" data-act="exo" data-i="' + i + '" aria-expanded="' + open + '">' +
      '<span class="nm"><small>' + MUSC[e.m] + '</small>' + esc(e.n) + '</span><span class="pg">' + (fin ? '&#10003; ' : '') + dn + '/' + n + '</span><span class="chev" aria-hidden="true">&#9662;</span></button>';
    if (open) {
      const j = curSet(i, it), s = it.sets[j], sg = suggest(x), canSwap = swapOptions(day, i).length > 1;
      h += '<div class="expan"><div class="sers">' + it.sets.map(function (q, jj) {
        if (jj === j) return '<button type="button" class="sbtn cur' + (q.done ? ' dn' : '') + '" data-act="serie" data-i="' + i + '">' + (q.done ? '&#10003; Série ' + (jj + 1) + ' concluída' : 'Concluir série ' + (jj + 1)) + '</button>';
        return '<button type="button" class="sbtn circ' + (q.done ? ' dn' : '') + '" data-act="sset" data-i="' + i + '" data-s="' + jj + '" aria-label="Série ' + (jj + 1) + (q.done ? ' concluída' : '') + '">' + (q.done ? '&#10003;' : (jj + 1)) + '</button>';
      }).join('') + '</div>' +
        '<div class="tiles"><label class="tile"><span class="label">Repetições</span><input type="text" inputmode="numeric" data-k="reps" data-i="' + i + '" data-s="' + j + '" value="' + esc(s.reps) + '" aria-label="Repetições da série ' + (j + 1) + '"><span class="sub">meta ' + x.lo + '–' + x.hi + '</span></label>' +
        '<label class="tile"><span class="label">' + (e.bw ? 'Carga extra' : 'Carga') + '</span><input type="text" inputmode="decimal" data-k="kg" data-i="' + i + '" data-s="' + j + '" value="' + esc(s.kg) + '" placeholder="kg" aria-label="Carga da série ' + (j + 1) + ' em kg"><span class="sub">kg</span></label>' +

    }

/* ===== presença: semana e mês ===== */
function presencaCard(plan, comBarras) {
  const pr = presenca(), meta = plan.length || 1;

    '<div class="kpi"><span class="label">Esta semana</span><b class="mono">' + pr.semana + '</b><span class="muted" style="font-size:.8rem">de ' + meta + ' dias na meta' + (pr.faltasSemana ? ' · ' + pr.faltasSemana + (pr.faltasSemana > 1 ? ' faltas' : ' falta') : '') + '</span></div>' +
    '<div class="kpi"><span class="label">' + MESES[new Date().getMonth()] + '</span><b class="mono">' + pr.mes + '</b><span class="muted" style="font-size:.8rem">' + (pr.mes === 1 ? 'dia' : 'dias') + ' de treino · ' + pr.faltasMes + (pr.faltasMes === 1 ? ' falta' : ' faltas') + '</span></div></div>';

    }).join('');
  }
  return h + '</div>';
}

/* ===== Análise ===== */
function volRows(V, F, prio) {
  const max = Math.max(24, Math.max.apply(null, Object.keys(V).map(function (m) { return V[m]; })));
  const pct = function (v) { return Math.min(100, v / max * 100); };
  return Object.keys(MUSC).map(function (m) {
    const b = volumeBand(S.profile.nivel, m);
    return '<div class="vol"><span' + (prio.indexOf(m) >= 0 ? ' class="prio"' : '') + '>' + MUSC[m] + '</span>' +
      '<div class="track" role="img" aria-label="' + MUSC[m] + ': ' + f1(V[m]) + ' séries por semana, alvo ' + b[0] + ' a ' + b[1] + '">' +
      '<div class="band" style="left:' + pct(b[0]) + '%;width:' + (pct(b[1]) - pct(b[0])) + '%"></div>' +
      '<div class="fill" style="width:' + pct(V[m]) + '%"></div></div>' +
      '<span class="num">' + f1(V[m]) + '</span><span class="fq">' + f1(F[m]) + '×</span></div>';
  }).join('');
}
function splitBar(V) {
  const sh = shares(V);
  if (!sh.t) return '';
  const w = function (k) { return (sh.g[k] / sh.t * 100) + '%'; };
  const p = function (k) { return Math.round(sh.g[k] / sh.t * 100) + '%'; };
  return '<div class="split" role="img" aria-label="Parte superior ' + p('sup') + ', inferior ' + p('inf') + ', abdômen ' + p('core') + '">' +
    '<span style="width:' + w('sup') + ';background:var(--accent)"></span><span style="width:' + w('inf') + ';background:var(--c2)"></span><span style="width:' + w('core') + ';background:var(--line)"></span></div>' +
    '<div class="legend"><span><span class="dot" style="background:var(--accent)"></span>Superior ' + p('sup') + '</span><span><span class="dot" style="background:var(--c2)"></span>Inferior ' + p('inf') + '</span><span><span class="dot" style="background:var(--line)"></span>Abdômen ' + p('core') + '</span></div>';
}
function alertCard(a) {
  return '<div class="card stack" style="gap:6px"><span class="pill ' + (a.sev === 'warn' ? 'warn' : a.sev === 'good' ? 'good' : '') + '" style="align-self:flex-start">' + esc(a.t) + '</span><p>' + esc(a.x) + '</p></div>';
}
function viewAnalise() {

    '<div class="kpi"><span class="label">Faltas</span><b class="mono">' + (ds ? ds.faltas : 0) + '</b><span class="muted" style="font-size:.8rem">que você marcou</span></div>' +
    '<div class="kpi"><span class="label">Média</span><b class="mono">' + (ds ? f1(ds.sessoes / ds.semanas) : '—') + '</b><span class="muted" style="font-size:.8rem">dias por semana</span></div></div>';
  h += presencaCard(plan, true);

    (ds ? '<p class="muted" style="font-size:.85rem;margin-top:6px">O que você fez (média semanal)</p>' + splitBar(ds.vol) : '') + '</div>';

  h += '<div class="card stack"><div><p class="label">Séries por semana: plano</p><p class="muted" style="font-size:.85rem;margin-top:4px">A faixa rosa escura é o alvo para o seu nível. O número à direita é quantas vezes por semana o músculo aparece.</p></div>' + volRows(ps.vol, ps.freq, prio) + '</div>';

/* ===== foto de perfil, backup e restauração ===== */
function lerFoto(file) {
  return new Promise(function (res, rej) {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function () {
      const im = new Image();
      im.onerror = rej;
      im.onload = function () {
        const s = Math.min(im.width, im.height), c = document.createElement('canvas');
        c.width = c.height = 192;
        const g = c.getContext('2d');
        if (!g) return rej(new Error('canvas'));
        g.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 192, 192);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function pintarAvatar() {
  const a = document.getElementById('ava');
  if (a) a.innerHTML = S.foto ? '<img alt="" src="' + S.foto + '">' : inicial();
}
async function salvarArquivo(nome, texto) {
  try {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: nome, data: texto }); return true; }
    }
  } catch (e) { if (e && e.code === 'declined') return false; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texto], { type: 'application/octet-stream' }));
    a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    return true;
  } catch (e) { return false; }
}
function montarCsv() {
  const L = [['data', 'tipo', 'treino', 'exercicio', 'musculo', 'serie', 'carga_kg', 'repeticoes', 'series_total', 'duracao_min']];
  const q = function (v) { v = String(v === undefined ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  S.arquivo.forEach(function (a) {
    Object.keys(a.m).forEach(function (m) { L.push([ymd(a.date), 'resumo', a.nome, '', MUSC[m] || m, '', '', '', a.m[m], a.dur || '']); });
  });
  S.logs.slice().reverse().forEach(function (l) {
    l.items.forEach(function (it) {
      const e = BYID[it.id];
      it.sets.forEach(function (s, j) { L.push([ymd(l.date), 'serie', l.nome, e ? e.n : it.id, e ? MUSC[e.m] : '', j + 1, s.kg, s.reps, '', l.dur || '']); });
    });
  });
  Object.keys(S.checkins).sort().forEach(function (k) {
    const c = S.checkins[k];
    L.push([k, c.foi ? 'presenca' : 'falta', (c.tr || []).map(function (t) { return 'Treino ' + t.toUpperCase(); }).join(' + '), '', c.musc.map(function (m) { return MUSC[m]; }).join(' + '), '', '', '', '', '']);
  });
  return '﻿' + L.map(function (r) { return r.map(q).join(';'); }).join('\r\n');
}

    const items = d.items.map(function (it) {
      return { id: it.id, sets: it.sets.filter(function (s) { return s.done; }).map(function (s) { return { kg: s.kg, reps: s.reps }; }) };
    }).filter(function (it) { return it.sets.length; });
    if (!items.length) return toast('Marque ao menos uma série concluída.');
    const dur = d.start && Date.now() - d.start < 4 * 36e5 ? Math.max(1, Math.round((Date.now() - d.start) / 60000)) : 0;
    S.logs.unshift({ id: 'l' + Date.now(), date: new Date().toISOString(), dayKey: day.key, nome: day.dia + ' · ' + day.nome, bloco: S.bloco.n, dur: dur, items: items });
    arquivarExcesso();
    delete S.drafts[day.key];
    SEL = null; stopTimer(); persist();
    toast(dur ? 'Treino salvo. Duração: ' + dur + ' min.' : 'Treino salvo.');
    return go('historico');
  }
});
document.addEventListener('input', function (ev) {
  const t = ev.target;
  if (t.id === 'nome') { S.profile.nome = t.value.trim(); persist(); return; }
  if (!t.dataset || !t.dataset.k || t.dataset.i === undefined) return;
  const day = achaDia(SEL);
  if (!day || !S.drafts[day.key]) return;
  S.drafts[day.key].items[parseInt(t.dataset.i, 10)].sets[parseInt(t.dataset.s, 10)][t.dataset.k] = t.value;
  persist();
});
document.addEventListener('change', function (ev) {
  const t = ev.target;
  if (t.id === 'peso') {
    const v = validPeso(t.value);
    if (v) { S.profile.peso = v; clearUntouchedDrafts(); persist(); t.value = pt(v); }
    else { toast('Informe um peso entre 30 e 250 kg.'); t.value = S.profile.peso ? pt(S.profile.peso) : ''; }
  } else if (t.id === 'rn-peso' && RN) {
    const v = validPeso(t.value);
    if (v) { RN.peso = v; t.value = pt(v); }
    else { toast('Informe um peso entre 30 e 250 kg.'); t.value = RN.peso ? pt(RN.peso) : ''; }
  }
});
document.getElementById('timerAdd').addEventListener('click', function () { tEnd += 30000; tick(); });
document.getElementById('timerX').addEventListener('click', stopTimer);

/* ===== Início ===== */
render();
(async function boot() {
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use('user');
    const db = await window.claude.use('db');
    if (!user || !db) return;
    const id = await user.id();
    if (!id) return;
    dbDoc = db.doc('data/users/' + id + '/treino');
    const snap = await dbDoc.get();
    if (snap.exists) {
      const d = snap.data();
      if (d && (d.updatedAt || 0) > (S.updatedAt || 0)) {
        S = normalize(d); lsSave(); planKey = '';
        if (!S.configured) TAB = 'perfil';
        render();
      } else if (d && (d.updatedAt || 0) < (S.updatedAt || 0)) { flush(); }
    } else if (S.configured || S.profile.nome) { flush(); }
  } catch (e) {}
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
